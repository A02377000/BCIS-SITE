<html>
<head>
<title>Loan Calculator</title>


  <script>
function loan() {
let r = document.getElementById("rate").value;
let PV = document.getElementById("pv").value;
let n = document.getElementById("num").value;

 let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));
  
document.getElementById("ans").innerHTML = "If you take a loan of $"+PV + " for a total of "+n +  " years, your payment per month will be $" + P.toFixed(2);
}
  </script>
  

  
</head>
<body>

  <p>Percent Rate: <input id="rate"> <br>
    Loan Amount: <input id="pv"> <br>
    Total Years: <input id="num"> <br>
    
    <button onclick="loan()"> Calculate the Loan: </button>

  </p>
<p>
<span id="ans"> __________ </span> </p>


<p>v2</p>
  
</body>
</html>
